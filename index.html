                Moonbase.sh Sample Store

    <main class="w-full flex justify-center p-4 md:p-8">

        <!-- List of products -->

            <!-- Single product card -->
            <div
                class="rounded-lg shadow-lg hover:shadow-xl max-w-prose overflow-hidden transition-shadow duration-500">
                <div class="aspect-square bg-blue-800">
                    <img class="h-full w-auto mx-auto"
                        src="https://assets.moonbase.sh/demo/products/juce-app-demo/icon/5128ac40-c270-44ad-ba3d-97026e257ccc.png"
                        alt="">
                </div>
                <div class="flex p-4 items-center">
                    <div class="flex-grow">
                        <h2 class="pb-4 text-xl font-semibold text-gray-800">
                            JUCE App Demo
                        </h2>
                        <p class="text-gray-700">
                            Demo app to showcase JUCE apps
                        </p>
                    </div>
                    <div class="flex flex-col items-center justify-around">
                        <div class="pb-2 text-lg whitespace-nowrap">
                            <span data-moonbase-if="product.juce-app-demo.has_discount" hidden data-moonbase-render="product.juce-app-demo.original_price" class="text-base text-gray-700 line-through mr-2"></span>
                            <span data-moonbase-render="product.juce-app-demo.price">€0</span>
                        </div>
                        <button
                            class="whitespace-nowrap py-2 px-4 rounded text-gray-100 transition-colors duration-500 bg-blue-800 hover:bg-blue-600"
                            onclick="Moonbase.add_to_cart({ product_id: 'juce-app-demo' })">
                            Add to cart
                        </button>
                    </div>
                </div>
            </div>

            <!-- Then a couple more products -->
            <div
                class="rounded-lg shadow-lg hover:shadow-xl max-w-prose overflow-hidden transition-shadow duration-500">
                <div class="aspect-square bg-blue-800">
                    <img class="h-full w-auto mx-auto"
                        src="https://assets.moonbase.sh/demo/products/juce-app-demo/icon/5128ac40-c270-44ad-ba3d-97026e257ccc.png"
                        alt="">
                </div>
                <div class="flex p-4 items-center">
                    <div class="flex-grow">
                        <h2 class="pb-4 text-xl font-semibold text-gray-800">
                            JUCE Bundle
                        </h2>
                        <p class="text-gray-700">
                            Contains all JUCE apps
                        </p>
                    </div>
                    <div class="flex flex-col items-center justify-around">
                        <div class="pb-2 text-lg whitespace-nowrap">
                            <span data-moonbase-if="bundle.juce-bundle.has_discount" hidden data-moonbase-render="bundle.juce-bundle.original_price" class="text-base text-gray-700 line-through mr-2"></span>
                            <span data-moonbase-render="bundle.juce-bundle.price">€0</span>
                        </div>
                        <button
                            class="whitespace-nowrap py-2 px-4 rounded text-gray-100 transition-colors duration-500 bg-blue-800 hover:bg-blue-600"

                        <h2 class="pb-4 text-xl font-semibold text-gray-800">
                            Demo app
                        </h2>
                        <p class="text-gray-700">
                            General purpose demo app
                        </p>

                    <div class="flex flex-col items-center justify-around">

    <script type="module" src="https://assets.moonbase.sh/storefront/moonbase.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            Moonbase.setup('https://demo.moonbase.sh', {
                toolbar: {
                    enabled: true,
                    location: 'bottom-right'
                }
            })

            Moonbase.on('added-to-cart', event => {
                console.log('added-to-cart:', event)
                gtag('event', 'add_to_cart', {
                    currency: event.currency,
                    value: event.item.price[event.currency] * event.item.quantity,
                    items: [
                        {
                            item_id: event.item.product ? event.item.product.id : event.item.bundle.id,
                            item_name: event.item.product ? event.item.product.name : event.item.bundle.name,
                            discount: event.item.appliedDiscount ? event.item.appliedDiscount.total[event.currency] : undefined,
                            price: event.item.price[event.currency],
                            quantity: event.item.quantity,
                        }
                    ]
                })

                fbq('track', 'AddToCart', {
                    currency: event.currency,
                    value: event.item.price[event.currency] * event.item.quantity,
                    content_ids: [event.item.product ? event.item.product.id : event.item.bundle.id],
                    content_name: event.item.product ? event.item.product.name : event.item.bundle.name,
                    content_type: 'product',
                })
            })

            Moonbase.on('checkout-initiated', event => {
                console.log('checkout-initiated:', event)
                gtag('event', 'begin_checkout', {
                    currency: event.total.currency,
                    value: event.total.amount,
                    items: event.order.items.map(item => ({
                        item_id: item.product ? item.product.id : item.bundle.id,
                        item_name: item.product ? item.product.name : item.bundle.name,
                        discount: item.appliedDiscount ? item.appliedDiscount.total[event.order.currency] : undefined,
                        price: item.price[event.order.currency],
                        quantity: item.quantity,
                    }))
                })

                fbq('track', 'InitiateCheckout', {
                    currency: event.order.currency,
                    value: event.order.total.due.amount,
                    num_items: event.order.items.length,
                    content_ids: event.order.items.map(item => item.product ? item.product.id : item.bundle.id),
                    contents: event.order.items.map(item => ({
                        id: item.product ? item.product.id : item.bundle.id,
                        name: item.product ? item.product.name : item.bundle.name,
                        discount: item.appliedDiscount ? item.appliedDiscount.total[event.order.currency] : undefined,
                        price: item.price[event.order.currency],
                        quantity: item.quantity,
                    }))
                })
            })

            Moonbase.on('checkout-completed', event => {
                console.log('checkout-completed:', event)
                gtag('event', 'purchase', {
                    transaction_id: event.order.id,
                    currency: event.order.currency,
                    value: event.order.total.due.amount,
                    tax: event.order.total.taxes.amount,
                    items: event.order.items.map(item => ({
                        item_id: item.product ? item.product.id : item.bundle.id,
                        item_name: item.product ? item.product.name : item.bundle.name,
                        discount: item.total.discount.amount,
                        price: item.total.due.amount,
                        quantity: item.quantity,
                    }))
                })

                fbq('track', 'Purchase', {
                    currency: event.order.currency,
                    value: event.order.total.due.amount,
                    num_items: event.order.items.length,
                    content_ids: event.order.items.map(item => item.product ? item.product.id : item.bundle.id),
                    contents: event.order.items.map(item => ({
                        id: item.product ? item.product.id : item.bundle.id,
                        name: item.product ? item.product.name : item.bundle.name,
                        discount: item.appliedDiscount ? item.appliedDiscount.total[event.order.currency] : undefined,
                        price: item.total.due.amount,
                        quantity: item.quantity,
                    }))
                })
            })
        })
    </script>

    <style>
        #moonbase {
            --moonbase-border-radius: 0px;
